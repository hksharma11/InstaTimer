# Builds an unsigned InstaTimer.ipa on GitHub's Macs, so you don't need one.
# Install it on your iPhone from Windows with Sideloadly (signs it with your Apple ID).
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project InstaTimer.xcodeproj -scheme InstaTimer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/InstaTimer.app Payload/
          zip -qr InstaTimer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: InstaTimer-ipa
          path: InstaTimer.ipa
