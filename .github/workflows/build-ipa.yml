# Builds an unsigned InstaTimer.ipa on GitHub's Macs, so you don't need one.
# Install it on your iPhone from Windows with Sideloadly (signs it with your Apple ID).
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project InstaTimer.xcodeproj -scheme InstaTimer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/InstaTimer.app Payload/
          find Payload -maxdepth 4
          zip -qr InstaTimer.ipa Payload
      - name: Check widget is embedded
        run: |
          W=Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          test -f "$W/InstaTimerWidget" && test -f "$W/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$W/Info.plist" | grep -q widgetkit-extension
      - name: Diagnostics
        run: |
          W=Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          echo "::notice title=WidgetInfo::$(plutil -convert json -o - "$W/Info.plist")"
          echo "::notice title=AppInfo::$(plutil -convert json -o - Payload/InstaTimer.app/Info.plist)"
          echo "::notice title=WidgetBinary::$(file "$W/InstaTimerWidget" | tr '\n' ' ') $(otool -l "$W/InstaTimerWidget" | grep -A4 LC_BUILD_VERSION | tr -s ' \n' ' ')"
          echo "::notice title=WidgetFiles::$(cd "$W" && find . | tr '\n' ' ')"
      - name: Check Live Activities key
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" Payload/InstaTimer.app/Info.plist | grep -q true
      - uses: actions/upload-artifact@v4
        with:
          name: InstaTimer-ipa
          path: InstaTimer.ipa
