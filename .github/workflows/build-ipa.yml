# Builds InstaTimer.ipa on GitHub's Macs, so you don't need one, and publishes it to
# Releases at a fixed link: /releases/latest/download/InstaTimer.ipa
# Install it with AltStore or Sideloadly (they sign it with your Apple ID).
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project InstaTimer.xcodeproj -scheme InstaTimer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/InstaTimer.app Payload/
          # Ad-hoc sign with the usual development entitlements so re-signers
          # (Sideloadly) treat the widget as an extension that needs its own profile.
          ent() {
            cat > "$2" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>ABCDE12345.$1</string>
            <key>com.apple.developer.team-identifier</key><string>ABCDE12345</string>
            <key>get-task-allow</key><true/>
          </dict></plist>
          EOF
          }
          ent com.example.instatimer.widget widget.entitlements
          ent com.example.instatimer app.entitlements
          codesign -f -s - --entitlements widget.entitlements Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          codesign -f -s - --entitlements app.entitlements Payload/InstaTimer.app
          codesign -d --entitlements - Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          find Payload -maxdepth 4
          zip -qr InstaTimer.ipa Payload
      - name: Check widget is embedded
        run: |
          W=Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          test -f "$W/InstaTimerWidget" && test -f "$W/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$W/Info.plist" | grep -q widgetkit-extension
      - name: Diagnostics
        run: |
          W=Payload/InstaTimer.app/PlugIns/InstaTimerWidget.appex
          echo "::notice title=WidgetInfo::$(plutil -convert json -o - "$W/Info.plist")"
          echo "::notice title=AppInfo::$(plutil -convert json -o - Payload/InstaTimer.app/Info.plist)"
          echo "::notice title=WidgetBinary::$(file "$W/InstaTimerWidget" | tr '\n' ' ') $(otool -l "$W/InstaTimerWidget" | grep -A4 LC_BUILD_VERSION | tr -s ' \n' ' ')"
          echo "::notice title=WidgetFiles::$(cd "$W" && find . | tr '\n' ' ')"
          echo "::notice title=WidgetEntitlements::$(codesign -d --entitlements - --xml "$W" 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=AppSignature::$(codesign -dv Payload/InstaTimer.app 2>&1 | tr '\n' ' ')"
      - name: Check Live Activities key
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" Payload/InstaTimer.app/Info.plist | grep -q true
      - uses: actions/upload-artifact@v4
        with:
          name: InstaTimer-ipa
          path: InstaTimer.ipa
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InstaTimer.ipa --latest             --title "InstaTimer (latest build)"             --notes "Built from commit ${GITHUB_SHA::7}. Open this link on your iPhone and install InstaTimer.ipa with AltStore."
